# =====================================================================
# MODEL REGISTRY  (Phase 3.1)
# The agent reads THIS FILE at runtime to discover tools. Adding a model =
# adding a block here + one Tool subclass. No controller code changes.
#
# Each tool declares:
#   name          : must match the Tool subclass `name`
#   module/class  : where to import it from
#   tasks         : which tasks it can answer
#   input_type    : single_image | optical_sar_pair | bitemporal_pair
#   modalities    : which image modalities it accepts
#   allowed_params: the ONLY params the executor may pass (PS: "configure only
#                   permitted task parameters"). Anything else is rejected.
#   outputs       : what kinds of evidence it returns
# =====================================================================

tools:
  - name: geochat
    module: backend.tools.geochat_tool
    class: GeoChatTool
    tasks: [single_vqa, single_caption, single_grounding]
    input_type: single_image
    modalities: [optical, multispectral, sar]
    allowed_params:
      max_new_tokens: {type: int, default: 256, min: 16, max: 1024}
      temperature: {type: float, default: 0.2, min: 0.0, max: 1.0}
    outputs: [text, bbox]

  - name: change
    module: backend.tools.change_tool
    class: ChangeTool
    tasks: [change_vqa, change_map]
    input_type: bitemporal_pair
    modalities: [optical, multispectral, sar]
    allowed_params:
      threshold: {type: float, default: 0.5, min: 0.0, max: 1.0}
    outputs: [text, change_map]

  - name: optical_sar
    module: backend.tools.optical_sar_tool
    class: OpticalSarTool
    tasks: [cross_modal]
    input_type: optical_sar_pair
    modalities: [optical, multispectral, sar]
    allowed_params:
      target_classes: {type: list, default: [built_up, water]}
    outputs: [text, mask, overlay]
